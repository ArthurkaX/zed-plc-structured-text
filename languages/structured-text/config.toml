name = "Structured Text"
grammar = "structured_text"
path_suffixes = ["st", "iecst"]
line_comments = ["// "]
tab_size = 4
hard_tabs = false

brackets = [
  { start = "(", end = ")", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "(*", end = "*)", close = true, newline = false, not_in = ["string", "comment"] },
]
